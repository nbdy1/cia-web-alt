<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CDS untuk Guru</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #f4fbf8; color: #0f172a; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 320px; text-align: center; }
    .badge { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 22px; background: #fff;
      border: 2px solid #d1fae5; box-shadow: 0 4px 0 #a7f3d0; display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 800; color: #007f5f; letter-spacing: -1px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.55; color: #475569; margin: 0 0 22px; font-weight: 500; }
    button { width: 100%; height: 48px; border: 0; border-radius: 16px; background: #007f5f; color: #fff;
      font-size: 15px; font-weight: 700; box-shadow: 0 4px 0 #005c45; }
    button:active { transform: translateY(2px); box-shadow: 0 2px 0 #005c45; }
    small { display: block; margin-top: 14px; font-size: 12px; color: #94a3b8; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="badge">CDS</div>
    <h1>Tidak ada koneksi</h1>
    <p>Aplikasi membutuhkan internet untuk memuat data. Periksa sinyal atau Wi-Fi Anda, lalu coba lagi.</p>
    <button id="retry" type="button">Coba lagi</button>
    <small>Data Anda aman dan tidak hilang.</small>
  </main>
  <script>
    // Shown by Capacitor (server.errorPath) when the live site cannot be reached.
    var TARGET = "https://characterdev.systems/";
    document.getElementById("retry").addEventListener("click", function () { location.replace(TARGET); });
    // Retry on its own as soon as the phone is back online.
    window.addEventListener("online", function () { location.replace(TARGET); });
  </script>
</body>
</html>
